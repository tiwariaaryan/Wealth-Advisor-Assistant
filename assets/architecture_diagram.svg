<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 700" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0B0F19; }
      .card { fill: #1E293B; rx: 12px; stroke: #334155; stroke-width: 1.5; }
      .card-glow-blue { fill: #1E293B; rx: 12px; stroke: #3B82F6; stroke-width: 2; }
      .card-glow-green { fill: #1E293B; rx: 12px; stroke: #10B981; stroke-width: 2; }
      .card-glow-purple { fill: #1E293B; rx: 12px; stroke: #8B5CF6; stroke-width: 2; }
      .card-glow-amber { fill: #1E293B; rx: 12px; stroke: #F59E0B; stroke-width: 2; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 26px; font-weight: 800; fill: #F8FAFC; }
      .header-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; fill: #94A3B8; }
      .layer-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #94A3B8; text-transform: uppercase; letter-spacing: 1.2px; }
      .node-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #FFFFFF; }
      .node-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94A3B8; }
      .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; }
      .arrow { stroke: #64748B; stroke-width: 2; fill: none; stroke-dasharray: 4,4; }
      .arrow-solid { stroke: #38BDF8; stroke-width: 2.5; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38BDF8" />
    </marker>
    <marker id="arrowhead-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748B" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1150" height="700" class="bg" rx="16"/>

  <!-- Top Title Bar -->
  <text x="50" y="55" class="header-title">🏛️ Wealth Advisor Assistant</text>
  <text x="50" y="80" class="header-sub">Production Multi-Agent System Architecture • Google Gemini LLM • Deterministic Analytics</text>

  <!-- LAYER 1: PRESENTATION & INTERACTION -->
  <text x="50" y="125" class="layer-title">1. Presentation Layer</text>
  
  <!-- Web UI Card -->
  <rect x="50" y="140" width="320" height="85" class="card-glow-blue" />
  <circle cx="85" cy="182" r="20" fill="#1D4ED8" fill-opacity="0.3"/>
  <text x="85" y="188" font-size="20" text-anchor="middle">🖥️</text>
  <text x="120" y="172" class="node-title">Streamlit Web App</text>
  <text x="120" y="193" class="node-desc">Interactive Plotly charts, client picker,</text>
  <text x="120" y="210" class="node-desc">HITL review card, and Gemini Q&amp;A</text>

  <!-- CLI Card -->
  <rect x="400" y="140" width="320" height="85" class="card-glow-blue" />
  <circle cx="435" cy="182" r="20" fill="#1D4ED8" fill-opacity="0.3"/>
  <text x="435" y="188" font-size="20" text-anchor="middle">⌨️</text>
  <text x="470" y="172" class="node-title">Terminal CLI Runner</text>
  <text x="470" y="193" class="node-desc">Rich-formatted tables, colored logs,</text>
  <text x="470" y="210" class="node-desc">spinners, and interactive prompts</text>

  <!-- Input Sources -->
  <rect x="750" y="140" width="350" height="85" class="card" />
  <circle cx="785" cy="182" r="20" fill="#475569" fill-opacity="0.3"/>
  <text x="785" y="188" font-size="20" text-anchor="middle">📁</text>
  <text x="820" y="172" class="node-title">Input Data Ingestion</text>
  <text x="820" y="193" class="node-desc">Client Financial JSON (Holdings, Cash, Tx)</text>
  <text x="820" y="210" class="node-desc">Mock CRM Profiles (Goals, Risk Mandate)</text>

  <!-- Arrows from Layer 1 to Orchestrator -->
  <path d="M 210 225 L 210 270 L 530 270 L 530 300" class="arrow-solid" marker-end="url(#arrowhead)"/>
  <path d="M 560 225 L 560 300" class="arrow-solid" marker-end="url(#arrowhead)"/>

  <!-- LAYER 2: CENTRAL ORCHESTRATION -->
  <text x="50" y="285" class="layer-title">2. Orchestration &amp; State Layer</text>
  
  <rect x="360" y="300" width="430" height="95" class="card-glow-purple" />
  <circle cx="400" cy="347" r="24" fill="#7C3AED" fill-opacity="0.3"/>
  <text x="400" y="355" font-size="24" text-anchor="middle">⚙️</text>
  <text x="440" y="337" class="node-title">Orchestrator Agent</text>
  <text x="440" y="358" class="node-desc">Central pipeline coordinator, state machine manager,</text>
  <text x="440" y="376" class="node-desc">and human-in-the-loop gatekeeper</text>
  <rect x="670" y="315" width="105" height="24" rx="12" fill="#7C3AED" />
  <text x="722" y="331" fill="#FFFFFF" class="badge" text-anchor="middle">Core Router</text>

  <!-- Short Term Memory Box -->
  <rect x="830" y="300" width="270" height="95" class="card" />
  <circle cx="860" cy="347" r="20" fill="#64748B" fill-opacity="0.3"/>
  <text x="860" y="353" font-size="20" text-anchor="middle">🧠</text>
  <text x="895" y="337" class="node-title">Short-Term Memory</text>
  <text x="895" y="358" class="node-desc">In-memory session scratchpad,</text>
  <text x="895" y="376" class="node-desc">agent trace &amp; intermediate state</text>
  <path d="M 790 347 L 830 347" class="arrow" marker-end="url(#arrowhead-gray)"/>

  <!-- Arrows from Orchestrator to Specialized Agents -->
  <path d="M 440 395 L 440 435 L 180 435 L 180 460" class="arrow-solid" marker-end="url(#arrowhead)"/>
  <path d="M 575 395 L 575 460" class="arrow-solid" marker-end="url(#arrowhead)"/>
  <path d="M 710 395 L 710 435 L 960 435 L 960 460" class="arrow-solid" marker-end="url(#arrowhead)"/>

  <!-- LAYER 3: SPECIALIZED AGENTS -->
  <text x="50" y="445" class="layer-title">3. Specialized Agents</text>

  <!-- Agent 1: Data Fetcher -->
  <rect x="50" y="460" width="310" height="95" class="card" />
  <circle cx="85" cy="507" r="20" fill="#0EA5E9" fill-opacity="0.3"/>
  <text x="85" y="513" font-size="20" text-anchor="middle">📥</text>
  <text x="120" y="492" class="node-title">Data Fetcher Agent</text>
  <text x="120" y="513" class="node-desc">Ingests JSON financial records</text>
  <text x="120" y="531" class="node-desc">&amp; queries CRM risk mandates</text>

  <!-- Agent 2: Analyzer Agent -->
  <rect x="420" y="460" width="310" height="95" class="card" />
  <circle cx="455" cy="507" r="20" fill="#F59E0B" fill-opacity="0.3"/>
  <text x="455" y="513" font-size="20" text-anchor="middle">📊</text>
  <text x="490" y="492" class="node-title">Analyzer Agent</text>
  <text x="490" y="513" class="node-desc">Runs deterministic math &amp;</text>
  <text x="490" y="531" class="node-desc">statistical outlier anomaly detection</text>

  <!-- Agent 3: Advisor Agent -->
  <rect x="790" y="460" width="310" height="95" class="card-glow-green" />
  <circle cx="825" cy="507" r="20" fill="#10B981" fill-opacity="0.3"/>
  <text x="825" y="513" font-size="20" text-anchor="middle">🤖</text>
  <text x="860" y="492" class="node-title">Advisor Agent (Gemini)</text>
  <text x="860" y="513" class="node-desc">Synthesizes fiduciary recommendations</text>
  <text x="860" y="531" class="node-desc">&amp; structured rebalancing matrix</text>

  <!-- Arrows to Subsystems -->
  <path d="M 205 555 L 205 600" class="arrow-solid" marker-end="url(#arrowhead)"/>
  <path d="M 575 555 L 575 600" class="arrow-solid" marker-end="url(#arrowhead)"/>
  <path d="M 945 555 L 945 600" class="arrow-solid" marker-end="url(#arrowhead)"/>

  <!-- LAYER 4: TOOLS, GOVERNANCE & LLM -->
  <text x="50" y="585" class="layer-title">4. Tools, Governance &amp; AI Engine</text>

  <!-- Tool 1: CRM Tool -->
  <rect x="50" y="600" width="310" height="75" class="card" />
  <text x="75" y="628" class="node-title" font-size="14">🔧 CRMTool (BaseTool)</text>
  <text x="75" y="647" class="node-desc">Simulated API, latency, and fallback cache</text>
  <text x="75" y="663" class="node-desc">Returns goals, tax bracket, &amp; risk profile</text>

  <!-- Tool 2: Portfolio & Anomaly Tools -->
  <rect x="420" y="600" width="310" height="75" class="card" />
  <text x="440" y="628" class="node-title" font-size="14">📐 Portfolio &amp; Anomaly Tools</text>
  <text x="440" y="647" class="node-desc">Math: AUM, cash drag, concentration %</text>
  <text x="440" y="663" class="node-desc">Stats: Z-score &gt; 2.5σ debit spending outlier</text>

  <!-- Engine: Gemini LLM + HITL -->
  <rect x="790" y="600" width="310" height="75" class="card-glow-green" />
  <text x="815" y="628" class="node-title" font-size="14">✨ Google Gemini LLM Engine</text>
  <text x="815" y="647" class="node-desc">Model: gemini-2.5-flash with Structured Output</text>
  <text x="815" y="663" class="node-desc">Controlled by Human-in-the-Loop review</text>

</svg>